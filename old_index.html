<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signature e-mail SEPCO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #121212;
  --muted: #5c5c5c;
  --line: #d6d6d6;
  --paper: #f3f1ec;
  --surface: #ffffff;
  --accent: #1a1a1a;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "DM Sans", Arial, Helvetica, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #e8e4dc 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #ddd8cf 0%, transparent 50%),
    var(--paper);
  line-height: 1.5;
}

#app {
  max-width: 920px;
  margin: 0 auto;
  padding: 48px 20px 72px;
}

.site-header {
  margin-bottom: 40px;
  animation: rise 0.7s ease both;
}

.brand {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: clamp(2.75rem, 6vw, 4rem);
  letter-spacing: 0.04em;
  line-height: 1;
}

.site-header h1 {
  margin: 0 0 12px;
  font-family: var(--sans);
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.lede {
  margin: 0;
  max-width: 38rem;
  color: var(--muted);
  font-size: 1.05rem;
}

main > section {
  margin-bottom: 40px;
  animation: rise 0.7s ease both;
}

.preview-section {
  animation-delay: 0.08s;
}

.code-section {
  animation-delay: 0.16s;
}

.install-section {
  animation-delay: 0.24s;
}

.note-section {
  animation-delay: 0.32s;
}

.section-head h2 {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 1.85rem;
  font-weight: 400;
}

.section-head p {
  margin: 0 0 18px;
  color: var(--muted);
}

.mail-frame {
  --frame-width: 100%;
  width: var(--frame-width);
  max-width: 100%;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--line);
  transition: width 0.35s ease;
}

.mail-chrome {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: #faf9f7;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #cfc9bf;
}

.mail-label {
  margin-left: 8px;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.mail-body {
  padding: 28px 24px 32px;
}

.fake-message {
  margin: 0 0 28px;
  color: #2a2a2a;
  font-size: 0.95rem;
}

.signature-slot {
  width: 100%;
}

.width-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--line);
  background: #faf9f7;
}

.width-controls button,
.primary {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.85rem;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.width-controls button:hover,
.primary:hover {
  border-color: var(--ink);
}

.width-controls button.active,
.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.code-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.status {
  font-size: 0.85rem;
  color: #2f6b3a;
  min-height: 1.2em;
}

pre {
  margin: 0;
  padding: 16px;
  overflow: auto;
  background: #161616;
  color: #e8e4dc;
  font-size: 0.78rem;
  line-height: 1.55;
  border: 1px solid #2a2a2a;
}

.install-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.install-grid article {
  padding: 0;
}

.install-grid h3 {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 400;
}

.install-grid ol {
  margin: 0;
  padding-left: 1.15rem;
  color: var(--muted);
  font-size: 0.92rem;
}

.install-grid li + li {
  margin-top: 6px;
}

.note-section {
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.note-section h2 {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: 1.5rem;
  font-weight: 400;
}

.note-section p {
  margin: 0;
  color: var(--muted);
  max-width: 42rem;
}

.note-section code,
.install-grid code {
  font-size: 0.85em;
  background: rgba(0, 0, 0, 0.06);
  padding: 1px 4px;
}

.site-footer {
  margin-top: 48px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.85rem;
}

.site-footer a {
  color: var(--ink);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 800px) {
  #app {
    padding: 32px 16px 56px;
  }

  .install-grid {
    grid-template-columns: 1fr;
  }

  .mail-body {
    padding: 22px 16px 26px;
  }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>
const SIGNATURE = "<table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" role=\"presentation\" style=\"width:100%; max-width:100%; border-collapse:collapse; border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt; font-family:'Times New Roman', Times, Georgia, serif;\">\n  <tr>\n    <td bgcolor=\"#000000\" height=\"1\" style=\"background-color:#000000; height:1px; line-height:1px; font-size:1px; mso-line-height-rule:exactly;\">&nbsp;</td>\n  </tr>\n  <tr>\n    <td style=\"padding:16px 0 12px 0;\">\n      <a href=\"https://www.sepco.be\" target=\"_blank\" style=\"text-decoration:none; border:0;\">\n        <img\n          src=\"https://remyd1999-tech.github.io/email-assets-sepco/Logo.png\"\n          width=\"200\"\n          height=\"31\"\n          alt=\"SEPCO\"\n          border=\"0\"\n          style=\"display:block; border:0; outline:none; text-decoration:none; width:200px; max-width:200px; height:auto;\"\n        />\n      </a>\n    </td>\n  </tr>\n  <tr>\n    <td style=\"padding:0; font-family:'Times New Roman', Times, Georgia, serif; font-size:16px; line-height:18px; color:#8a8a8a;\">\n      BE540 256 321 452<br />\n      <a href=\"tel:+32457546258\" style=\"color:#8a8a8a; text-decoration:none; font-family:'Times New Roman', Times, Georgia, serif; font-size:16px; line-height:18px;\">+ 32 457 54 62 58</a><br />\n      <a href=\"https://www.sepco.be\" target=\"_blank\" style=\"color:#8a8a8a; text-decoration:none; font-family:'Times New Roman', Times, Georgia, serif; font-size:16px; line-height:18px;\">www.sepco.be</a>\n    </td>\n  </tr>\n  <tr>\n    <td style=\"padding:14px 0 0 0; font-family:'Times New Roman', Times, Georgia, serif; font-size:16px; line-height:18px; color:#8a8a8a;\">\n      SEPCO<br />\n      Avenue Zenobe Gramme 30<br />\n      1300 Wavre, Belgique\n    </td>\n  </tr>\n</table>";
const app = document.getElementById('app');
app.innerHTML = `
  <header class="site-header">
    <p class="brand">SEPCO</p>
    <h1>Signature e-mail</h1>
    <p class="lede">
      HTML prêt pour Outlook, Apple Mail et Gmail — logo hébergé sur GitHub Pages,
      avec un filet pleine largeur au-dessus.
    </p>
  </header>
  <main>
    <section class="preview-section" aria-labelledby="preview-title">
      <div class="section-head">
        <h2 id="preview-title">Aperçu</h2>
        <p>Simulation d’un message : le filet suit la largeur de la zone de lecture.</p>
      </div>
      <div class="mail-frame" id="mail-frame">
        <div class="mail-chrome">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="mail-label">Message · largeur adaptable</span>
        </div>
        <div class="mail-body">
          <p class="fake-message">
            Bonjour,<br /><br />
            Voici le devis demandé. N’hésitez pas à me contacter pour toute question.<br /><br />
            Cordialement,<br />
            Adrien
          </p>
          <div class="signature-slot" id="signature-preview">${SIGNATURE}</div>
        </div>
        <div class="width-controls" role="group" aria-label="Largeur de prévisualisation">
          <button type="button" data-width="100%" class="active">Pleine largeur</button>
          <button type="button" data-width="640px">640px</button>
          <button type="button" data-width="420px">Mobile</button>
        </div>
      </div>
    </section>
    <section class="code-section" aria-labelledby="code-title">
      <div class="section-head">
        <h2 id="code-title">Code HTML</h2>
        <p>Copiez ce bloc et collez-le dans la signature de votre client mail.</p>
      </div>
      <div class="code-toolbar">
        <button type="button" id="copy-btn" class="primary">Copier le HTML</button>
        <span id="copy-status" class="status" role="status" aria-live="polite"></span>
      </div>
      <pre><code id="signature-code"></code></pre>
    </section>
    <section class="install-section" aria-labelledby="install-title">
      <div class="section-head">
        <h2 id="install-title">Installation</h2>
        <p>Procédure courte pour les trois clients principaux.</p>
      </div>
      <div class="install-grid">
        <article>
          <h3>Gmail</h3>
          <ol>
            <li>Paramètres → Voir tous les paramètres → Général</li>
            <li>Descendre jusqu’à <em>Signature</em></li>
            <li>Créer une signature, coller le HTML (mode riche)</li>
            <li>Astuce : coller depuis l’aperçu de cette page fonctionne souvent mieux que le code brut</li>
          </ol>
        </article>
        <article>
          <h3>Apple Mail</h3>
          <ol>
            <li>Mail → Réglages → Signatures</li>
            <li>Créer une signature, coller depuis l’aperçu de cette page</li>
            <li>Optionnel : TextEdit en HTML brut, puis glisser le fichier dans Signatures</li>
          </ol>
        </article>
        <article>
          <h3>Outlook</h3>
          <ol>
            <li>Fichier → Options → Courrier → Signatures</li>
            <li>Nouvelle signature, coller depuis l’aperçu (pas le code source)</li>
            <li>Le filet <code>width="100%"</code> s’adapte à la zone de composition</li>
          </ol>
        </article>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p>Lien public à envoyer au client : cette page sur GitHub Pages.</p>
  </footer>
`;

document.getElementById('signature-code').textContent = SIGNATURE;
const mailFrame = document.getElementById('mail-frame');
document.querySelectorAll('.width-controls button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.width-controls button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    mailFrame.style.setProperty('--frame-width', btn.dataset.width || '100%');
  });
});
const copyBtn = document.getElementById('copy-btn');
const copyStatus = document.getElementById('copy-status');
const codeEl = document.getElementById('signature-code');
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(SIGNATURE);
    copyStatus.textContent = 'Copié dans le presse-papiers';
  } catch {
    const range = document.createRange();
    range.selectNodeContents(codeEl);
    const sel = window.getSelection();
    sel && sel.removeAllRanges();
    sel && sel.addRange(range);
    copyStatus.textContent = 'Sélectionnez Ctrl/Cmd+C pour copier';
  }
  setTimeout(() => { copyStatus.textContent = ''; }, 2500);
});
  </script>
</body>
</html>
