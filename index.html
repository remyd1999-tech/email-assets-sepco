<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signatures e-mail SEPCO</title>
  <style>
:root {
  --ink: #121212;
  --muted: #5c5c5c;
  --line: #d6d6d6;
  --paper: #f3f1ec;
  --surface: #ffffff;
  --accent: #1a1a1a;
  --sans: Arial, Helvetica, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #e8e4dc 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #ddd8cf 0%, transparent 50%),
    var(--paper);
  line-height: 1.5;
}

#app {
  max-width: 920px;
  margin: 0 auto;
  padding: 48px 20px 72px;
}

.site-header {
  margin-bottom: 40px;
  animation: rise 0.7s ease both;
}

.brand {
  margin: 0 0 8px;
  font-family: var(--sans);
  font-size: clamp(2.75rem, 6vw, 4rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1;
}

.site-header h1 {
  margin: 0 0 12px;
  font-family: var(--sans);
  font-size: 1.05rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.lede {
  margin: 0;
  max-width: 38rem;
  color: var(--muted);
  font-size: 1.05rem;
}

main > section {
  margin-bottom: 40px;
  animation: rise 0.7s ease both;
}

.preview-section { animation-delay: 0.08s; }
.code-section { animation-delay: 0.24s; }
.install-section { animation-delay: 0.16s; }

.section-head h2 {
  margin: 0 0 6px;
  font-family: var(--sans);
  font-size: 1.85rem;
  font-weight: 700;
}

.section-head p {
  margin: 0 0 18px;
  color: var(--muted);
}

.person-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.person-picker button {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.85rem;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.person-picker button:hover {
  border-color: var(--ink);
}

.person-picker button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.mail-frame {
  --frame-width: 100%;
  width: var(--frame-width);
  max-width: 100%;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--line);
  transition: width 0.35s ease;
}

.mail-chrome {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: #faf9f7;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #cfc9bf;
}

.mail-label {
  margin-left: 8px;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.mail-body {
  padding: 28px 24px 32px;
}

.fake-message {
  margin: 0 0 28px;
  color: #2a2a2a;
  font-size: 0.95rem;
}

.signature-slot {
  width: 100%;
}

.width-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--line);
  background: #faf9f7;
}

.width-controls button,
.primary {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 0.85rem;
  padding: 8px 12px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.width-controls button:hover,
.primary:hover {
  border-color: var(--ink);
}

.width-controls button.active,
.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.code-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.status {
  font-size: 0.85rem;
  color: #2f6b3a;
  min-height: 1.2em;
}

pre {
  margin: 0;
  padding: 16px;
  overflow: auto;
  background: #161616;
  color: #e8e4dc;
  font-size: 0.78rem;
  line-height: 1.55;
  border: 1px solid #2a2a2a;
}

.install-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.install-grid h3 {
  margin: 0 0 10px;
  font-family: var(--sans);
  font-size: 1.35rem;
  font-weight: 700;
}

.install-grid ol {
  margin: 0;
  padding-left: 1.15rem;
  color: var(--muted);
  font-size: 0.92rem;
}

.install-grid li + li {
  margin-top: 6px;
}

.site-footer {
  margin-top: 48px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.85rem;
}

.install-grid code {
  font-size: 0.85em;
  background: rgba(0, 0, 0, 0.06);
  padding: 1px 4px;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 800px) {
  #app {
    padding: 32px 16px 56px;
  }

  .install-grid {
    grid-template-columns: 1fr;
  }

  .mail-body {
    padding: 22px 16px 26px;
  }
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
const LOGO_URL = 'https://remyd1999-tech.github.io/email-assets-sepco/Logo.png';
const FONT = "Arial, Helvetica, sans-serif";
const FOOTER_STYLE = `font-family:${FONT}; font-size:14px; line-height:18px; color:rgba(0,0,0,0.6);`;

const EMPLOYEES = [
  {
    id: 'sandrine',
    firstName: 'Sandrine',
    name: 'Sandrine Desimpelaere',
    titleLines: ['Office Manager'],
  },
  {
    id: 'fabienne',
    firstName: 'Fabienne',
    name: 'Fabienne Steyaert',
    titleLines: ['Senior Accountant'],
  },
  {
    id: 'julien',
    firstName: 'Julien',
    name: 'Julien Lefranc',
    titleLines: ['Accountant'],
  },
  {
    id: 'adrien',
    firstName: 'Adrien',
    name: 'Adrien Sepulchre',
    titleLines: [
      'Administrateur | Candidat Expert-Comptable ITAA',
      'n° ITAA 14.036.910',
    ],
  },
  {
    id: 'philippe',
    firstName: 'Philippe',
    name: 'Philippe Sepulchre',
    titleLines: [
      'Administrateur | Expert-Comptable Fiscaliste ITAA',
      'n° ITAA 11.112.156',
    ],
  },
  {
    id: 'karla',
    firstName: 'Karla',
    name: 'Karla Yakhina',
    titleLines: ['Senior Accountant'],
  },
];

function buildSignature(employee) {
  const titleHtml = employee.titleLines
    .map((line) => `${line}<br />`)
    .join('');

  return `<table width="100%" border="0" cellspacing="0" cellpadding="0" role="presentation" style="width:100%; max-width:100%; border-collapse:collapse; border-spacing:0; mso-table-lspace:0pt; mso-table-rspace:0pt; font-family:${FONT};">
  <tr>
    <td style="padding:0 0 12px 0; font-family:${FONT}; font-size:16px; line-height:22px; color:#000000;">
      <strong style="font-weight:700;">${employee.name}</strong><br />
      ${titleHtml}
    </td>
  </tr>
  <tr>
    <td bgcolor="#000000" height="1" style="background-color:#000000; height:1px; line-height:1px; font-size:1px; mso-line-height-rule:exactly;">&nbsp;</td>
  </tr>
  <tr>
    <td style="padding:16px 0 14px 0;">
      <a href="https://www.sepco.be" target="_blank" style="text-decoration:none; border:0;">
        <img
          src="${LOGO_URL}"
          width="180"
          height="28"
          alt="SEPCO"
          border="0"
          style="display:block; border:0; outline:none; text-decoration:none; width:180px; max-width:180px; height:auto;"
        />
      </a>
    </td>
  </tr>
  <tr>
    <td style="padding:0; ${FOOTER_STYLE}">
      Avenue Zenobe Gramme 30<br />
      1300 Wavre, Belgique<br />
      <span style="display:block; height:8px; line-height:8px; font-size:1px;">&nbsp;</span>
      BE 1012.818.966<br />
      <a href="tel:+3210243920" style="color:rgba(0,0,0,0.5); text-decoration:none; ${FOOTER_STYLE}">T. +32 10 24 39 20</a><br />
      <a href="https://www.sepco.be" target="_blank" style="color:rgba(0,0,0,0.5); text-decoration:none; ${FOOTER_STYLE}">www.sepco.be</a>
    </td>
  </tr>
</table>`;
}

let activeEmployee = EMPLOYEES[0];
let currentSignature = buildSignature(activeEmployee);

const app = document.getElementById('app');
app.innerHTML = `
  <header class="site-header">
    <p class="brand">SEPCO</p>
    <h1>Signatures e-mail</h1>
    <p class="lede">
      Une signature par collaborateur — HTML prêt pour Outlook, Apple Mail et Gmail.
    </p>
  </header>
  <main>
    <section class="preview-section" aria-labelledby="preview-title">
      <div class="section-head">
        <h2 id="preview-title">Aperçu</h2>
        <p>Sélectionnez un collaborateur, puis copiez la signature correspondante.</p>
      </div>
      <div class="person-picker" id="person-picker" role="tablist" aria-label="Choisir un collaborateur"></div>
      <div class="mail-frame" id="mail-frame">
        <div class="mail-chrome">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="mail-label" id="mail-label">Message · largeur adaptable</span>
        </div>
        <div class="mail-body">
          <p class="fake-message" id="fake-message"></p>
          <div class="signature-slot" id="signature-preview"></div>
        </div>
        <div class="width-controls" role="group" aria-label="Largeur de prévisualisation">
          <button type="button" data-width="100%" class="active">Pleine largeur</button>
          <button type="button" data-width="640px">640px</button>
          <button type="button" data-width="420px">Mobile</button>
        </div>
      </div>
    </section>
    <section class="install-section" aria-labelledby="install-title">
      <div class="section-head">
        <h2 id="install-title">Installation</h2>
        <p>Procédure courte pour les trois clients principaux.</p>
      </div>
      <div class="install-grid">
        <article>
          <h3>Gmail</h3>
          <ol>
            <li>Paramètres → Voir tous les paramètres → Général</li>
            <li>Descendre jusqu'à <em>Signature</em></li>
            <li>Créer une signature, coller le HTML (mode riche)</li>
            <li>Astuce : coller depuis l'aperçu de cette page fonctionne souvent mieux que le code brut</li>
          </ol>
        </article>
        <article>
          <h3>Apple Mail</h3>
          <ol>
            <li>Mail → Réglages → Signatures</li>
            <li>Créer une signature, coller depuis l'aperçu de cette page</li>
            <li>Optionnel : TextEdit en HTML brut, puis glisser le fichier dans Signatures</li>
          </ol>
        </article>
        <article>
          <h3>Outlook</h3>
          <ol>
            <li>Fichier → Options → Courrier → Signatures</li>
            <li>Nouvelle signature, coller depuis l'aperçu (pas le code source)</li>
            <li>Le filet <code>width="100%"</code> s'adapte à la zone de composition</li>
          </ol>
        </article>
      </div>
    </section>
    <section class="code-section" aria-labelledby="code-title">
      <div class="section-head">
        <h2 id="code-title">Code HTML</h2>
        <p>Copiez ce bloc et collez-le dans la signature de votre client mail.</p>
      </div>
      <div class="code-toolbar">
        <button type="button" id="copy-btn" class="primary">Copier le HTML</button>
        <span id="copy-status" class="status" role="status" aria-live="polite"></span>
      </div>
      <pre><code id="signature-code"></code></pre>
    </section>
  </main>
  <footer class="site-footer">
    <p>Lien public : cette page sur GitHub Pages.</p>
  </footer>
`;

const personPicker = document.getElementById('person-picker');
const signaturePreview = document.getElementById('signature-preview');
const signatureCode = document.getElementById('signature-code');
const fakeMessage = document.getElementById('fake-message');
const mailLabel = document.getElementById('mail-label');

function renderEmployee(employee) {
  activeEmployee = employee;
  currentSignature = buildSignature(employee);
  signaturePreview.innerHTML = currentSignature;
  signatureCode.textContent = currentSignature;
  fakeMessage.innerHTML = `
    Bonjour,<br /><br />
    Voici le devis demandé. N'hésitez pas à me contacter pour toute question.<br /><br />
    Cordialement,<br />
    ${employee.firstName}
  `;
  mailLabel.textContent = `Signature · ${employee.name}`;

  personPicker.querySelectorAll('button').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.id === employee.id);
    btn.setAttribute('aria-selected', btn.dataset.id === employee.id ? 'true' : 'false');
  });
}

EMPLOYEES.forEach((employee) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = employee.name;
  btn.dataset.id = employee.id;
  btn.setAttribute('role', 'tab');
  btn.setAttribute('aria-selected', employee.id === activeEmployee.id ? 'true' : 'false');
  btn.addEventListener('click', () => renderEmployee(employee));
  personPicker.appendChild(btn);
});

renderEmployee(activeEmployee);

const mailFrame = document.getElementById('mail-frame');
document.querySelectorAll('.width-controls button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.width-controls button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    mailFrame.style.setProperty('--frame-width', btn.dataset.width || '100%');
  });
});

const copyBtn = document.getElementById('copy-btn');
const copyStatus = document.getElementById('copy-status');
const codeEl = document.getElementById('signature-code');

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(currentSignature);
    copyStatus.textContent = 'Copié dans le presse-papiers';
  } catch {
    const range = document.createRange();
    range.selectNodeContents(codeEl);
    const sel = window.getSelection();
    sel && sel.removeAllRanges();
    sel && sel.addRange(range);
    copyStatus.textContent = 'Sélectionnez Ctrl/Cmd+C pour copier';
  }
  setTimeout(() => { copyStatus.textContent = ''; }, 2500);
});
  </script>
</body>
</html>
